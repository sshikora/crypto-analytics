name: Terraform Infrastructure Deployment

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
      action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

env:
  AWS_REGION: us-east-1
  TOFU_VERSION: 1.10.7

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::010151257830:role/crypto-analytics-production-github-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/${{ github.event.inputs.environment }}
        run: tofu init

      - name: Terraform Validate
        working-directory: infrastructure/terraform/environments/${{ github.event.inputs.environment }}
        run: tofu validate

      - name: Terraform Plan
        working-directory: infrastructure/terraform/environments/${{ github.event.inputs.environment }}
        env:
          TF_VAR_google_dkim_value: ${{ secrets.GOOGLE_DKIM_VALUE }}
        run: |
          tofu plan \
            -out=tfplan \
            -var-file=terraform.tfvars.cost-optimized
        continue-on-error: false

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: infrastructure/terraform/environments/${{ github.event.inputs.environment }}
        run: tofu apply tfplan

      - name: Terraform Output
        if: github.event.inputs.action == 'apply'
        working-directory: infrastructure/terraform/environments/${{ github.event.inputs.environment }}
        run: tofu output

      - name: Summary
        run: |
          echo "### Terraform ${{ github.event.inputs.action }} Completed ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Action**: ${{ github.event.inputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "**Region**: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
