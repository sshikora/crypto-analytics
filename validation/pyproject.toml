[project]
name = "cql-validation"
version = "0.1.0"
description = "Reference implementations used to validate CryptoQuantLab's models"
requires-python = ">=3.12"
dependencies = [
    "arch>=7.2",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "statsmodels>=0.14",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]
